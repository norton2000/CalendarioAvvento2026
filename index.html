<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Giulendario dell'Avvento 2026</title>

  <!-- Meta tag PWA & Mobile Fullscreen -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Giulendario">
  


  <link rel="icon" href="./assets/favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">

  <!-- Google Fonts: Playfair Display (titoli eleganti) & Plus Jakarta Sans (UI leggibile) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Effetto neve leggero in background -->
  <div class="snow-container" aria-hidden="true"></div>

  <!-- Banner visibile solo se la modalità debug è attiva via URL -->
  <div id="debug-banner" class="debug-banner hidden">
    <span id="debug-status">🔧 DEBUG MODE</span>
    <button id="btn-reset-storage" type="button">Reset & Rimescola</button>
  </div>

  <header class="app-header">
    <div class="header-badge">1 – 24 DICEMBRE 2026</div>
    <h1 class="app-title">Giulendario dell'Avvento</h1>
    <p id="current-date-display" class="app-subtitle">Ogni giorno una piccola sorpresa</p>
    
    <!-- Barra di progresso aperture -->
    <div class="progress-wrapper">
      <div class="progress-info">
        <span>Progresso sorprese</span>
        <span id="progress-counter">0 / 24</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Griglia 24 caselle mescolate generata dinamicamente da app.js -->
    <div id="calendar-grid" class="calendar-grid"></div>
  </main>

  <!-- Modal Popup per il contenuto del giorno -->
  <div id="reward-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-day-title">
    <div class="modal-card">
      <button id="modal-close" class="modal-close-btn" aria-label="Chiudi">&times;</button>
      
      <div class="modal-badge" id="modal-day-badge">GIORNO 1</div>
      <h2 id="modal-day-title" class="modal-title">Titolo Sorpresa</h2>
      
      <div class="modal-image-wrapper">
        <img id="modal-image" src="" alt="Immagine del giorno" loading="lazy" />
      </div>

      <p id="modal-message" class="modal-message"></p>

      <!-- Sezione Codice Regalo (nascosta automaticamente se il giorno non prevede codice) -->
      <div id="modal-code-section" class="gift-code-box">
        <span class="gift-code-label">CODICE REGALO</span>
        <div class="gift-code-row">
          <code id="modal-code-value" class="gift-code-value">XXXX-XXXX</code>
          <button id="btn-copy-code" class="btn-copy" type="button">Copia</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Container per notifiche Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Libreria leggera per coriandoli all'apertura della casella -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
